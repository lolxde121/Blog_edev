<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="marineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#071b30" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#marineGrad)" stroke="#38bdf8" stroke-width="4" />
  
  <!-- Subtle decorative grid/waves -->
  <path d="M20 100 Q 60 80, 100 100 T 180 100" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
  <path d="M15 130 Q 60 110, 100 130 T 185 130" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />

  <!-- Body / Shoulders -->
  <path d="M45 170 C 45 140, 70 128, 100 128 C 130 128, 155 140, 155 170 Z" fill="url(#faceGrad)" />
  <path d="M72 135 L100 160 L128 135" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Head -->
  <circle cx="100" cy="85" r="34" fill="url(#faceGrad)" />
  
  <!-- Hair / Cap -->
  <path d="M68 80 C 68 55, 82 48, 100 48 C 118 48, 132 55, 132 80 C 122 72, 110 70, 100 70 C 90 70, 78 72, 68 80 Z" fill="#0f172a" />
  
  <!-- Glasses / Developer look -->
  <rect x="76" y="78" width="18" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="106" y="78" width="18" height="12" rx="3" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <line x1="94" y1="84" x2="106" y2="84" stroke="#0f172a" stroke-width="2.5" />
  
  <!-- Smile -->
  <path d="M92 102 Q 100 108, 108 102" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Code symbol badge -->
  <circle cx="152" cy="148" r="20" fill="#0b192e" stroke="#38bdf8" stroke-width="2" />
  <text x="152" y="154" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">&lt;/&gt;</text>
</svg>
